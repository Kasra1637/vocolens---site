gn: center;\n    }\n\n    .eyebrow {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.4rem;\n      font-size: 12px;\n      font-weight: 500;\n      color: var(--purple-light);\n      letter-spacing: 0.06em;\n      text-transform: uppercase;\n      margin-bottom: 2rem;\n      padding: 0.35rem 0.9rem;\n      border: 0.5px solid rgba(124, 92, 191, 0.3);\n      border-radius: 999px;\n      background: rgba(124, 92, 191, 0.07);\n    }\n\n    .eyebrow::before {\n      content: '';\n      display: inline-block;\n      width: 6px;\n      height: 6px;\n      background: var(--purple-light);\n      border-radius: 50%;\n    }\n\n    h1 {\n      font-family: 'Fraunces', Georgia, serif;\n      font-size: clamp(3rem, 7vw, 4.5rem);\n      font-weight: 700;\n      font-variation-settings: 'SOFT' 1, 'opsz' 144;\n      line-height: 1.08;\n      letter-spacing: -0.02em;\n      color: var(--text);\n      margin-bottom: 1.25rem;\n    }\n\n    h1 em {\n      font-style: italic;\n      color: var(--purple-light);\n    }\n\n    .hero-sub {\n      font-size: 18px;\n      color: var(--text-muted);\n      line-height: 1.65;\n      max-width: 480px;\n      margin: 0 auto 2.5rem;\n    }\n\n    /* FORM */\n    .form-card {\n      max-width: 380px;\n      margin: 0 auto;\n    }\n\n    .form-group {\n      margin-bottom: 0.9rem;\n    }\n\n    label {\n      display: block;\n      font-size: 12px;\n      font-weight: 500;\n      color: var(--text-muted);\n      margin-bottom: 0.4rem;\n      letter-spacing: 0.03em;\n    }\n\n    input[type=\"email\"] {\n      width: 100%;\n      background: rgba(255, 255, 255, 0.04);\n      border: 0.5px solid rgba(124, 92, 191, 0.25);\n      border-radius: 8px;\n      padding: 0.7rem 1rem;\n      font-size: 15px;\n      font-family: var(--sans);\n      color: var(--text);\n      outline: none;\n      transition: border-color 0.2s, background 0.2s;\n    }\n\n    input[type=\"email\"]::placeholder { color: var(--text-dim); }\n\n    input[type=\"email\"]:focus {\n      border-color: var(--purple);\n      background: rgba(124, 92, 191, 0.07);\n    }\n\n    .btn-join {\n      width: 100%;\n      margin-top: 0.5rem;\n      padding: 0.85rem 1rem;\n      background: var(--purple);\n      color: #fff;\n      font-size: 15px;\n      font-weight: 500;\n      font-family: var(--sans);\n      border: none;\n      border-radius: 8px;\n      cursor: pointer;\n      transition: background 0.2s, transform 0.15s;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 0.5rem;\n    }\n\n    .btn-join:hover { background: #6a4dab; }\n    .btn-join:active { transform: scale(0.98); }\n\n    .btn-join svg { width: 16px; height: 16px; }\n\n    .form-note {\n      margin-top: 0.85rem;\n      font-size: 12px;\n      color: var(--text-dim);\n      text-align: center;\n    }\n\n    .gmail-note {\n      margin-top: 0.5rem;\n      font-size: 11px;\n      color: var(--text-dim);\n      text-align: center;\n      opacity: 0.75;\n    }\n\n    .error-msg {\n      margin-top: 0.5rem;\n      font-size: 12px;\n      color: rgba(220, 100, 100, 0.9);\n      text-align: center;\n      min-height: 1.2em;\n    }\n\n    .success-msg {\n      display: none;\n      text-align: center;\n      padding: 1.5rem 0 0.5rem;\n    }\n\n    .success-msg .check {\n      width: 44px;\n      height: 44px;\n      background: rgba(124, 92, 191, 0.15);\n      border-radius: 50%;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      margin: 0 auto 1rem;\n    }\n\n    .success-msg p {\n      font-size: 15px;\n      color: var(--text-muted);\n    }\n\n    .success-msg strong { color: var(--text); }\n\n    /* TRUST STRIP */\n    .trust-strip {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 0.75rem 1.25rem;\n      padding: 1.25rem 0 0;\n      max-width: 420px;\n      margin: 0 auto;\n    }\n\n    .trust-item {\n      display: flex;\n      align-items: center;\n      gap: 0.4rem;\n      font-size: 12px;\n      color: var(--text-dim);\n      white-space: nowrap;\n    }\n\n    .trust-item svg { width: 14px; height: 14px; color: var(--purple-light); flex-shrink: 0; }\n\n    /* DIVIDER */\n    .section-divider {\n      max-width: 800px;\n      margin: 0 auto;\n      padding: 0 2rem;\n      border-top: 0.5px solid rgba(124, 92, 191, 0.12);\n    }\n\n    /* FEATURES */\n    .features {\n      max-width: 800px;\n      margin: 0 auto;\n      padding: 5rem 2rem;\n    }\n\n    .section-label {\n      font-size: 12px;\n      font-weight: 500;\n      color: var(--purple-light);\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      margin-bottom: 1rem;\n    }\n\n    .features-heading {\n      font-family: var(--serif);\n      font-size: clamp(2rem, 4.5vw, 2.75rem);\n      font-weight: 400;\n      line-height: 1.15;\n      color: var(--text);\n      margin-bottom: 0.6rem;\n      white-space: nowrap;\n      max-width: 100%;\n    }\n\n    .features-sub {\n      font-size: 18px;\n      color: var(--text-muted);\n      margin-bottom: 3rem;\n      max-width: 400px;\n    }\n\n    .feature-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n      gap: 1rem;\n    }\n\n    .feature-card {\n      background: var(--bg-card);\n      border: 0.5px solid var(--bg-card-border);\n      border-radius: 12px;\n      padding: 1.5rem;\n    }\n\n    .feature-icon {\n      width: 36px;\n      height: 36px;\n      background: rgba(124, 92, 191, 0.12);\n      border-radius: 8px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      margin-bottom: 1rem;\n    }\n\n    .feature-icon svg { width: 18px; height: 18px; color: var(--purple-light); }\n\n    .feature-card h3 {\n      font-size: 16px;\n      font-weight: 500;\n      color: var(--text);\n      margin-bottom: 0.4rem;\n    }\n\n    .feature-card p {\n      font-size: 14px;\n      color: var(--text-muted);\n      line-height: 1.6;\n    }\n\n    /* TESTIMONIALS */\n    .testimonials {\n      max-width: 800px;\n      margin: 0 auto;\n      padding: 2rem 2rem 5rem;\n    }\n\n    .testimonial-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n      gap: 1rem;\n      margin-top: 3rem;\n    }\n\n    .testimonial-card {\n      background: var(--bg-card);\n      border: 0.5px solid var(--bg-card-border);\n      border-radius: 12px;\n      padding: 1.5rem;\n    }\n\n    .stars {\n      display: flex;\n      gap: 2px;\n      margin-bottom: 0.75rem;\n    }\n\n    .stars svg { width: 13px; height: 13px; fill: var(--purple-light); }\n\n    .testimonial-card blockquote {\n      font-family: var(--serif);\n      font-size: 16px;\n      font-style: italic;\n      color: var(--text);\n      line-height: 1.5;\n      margin-bottom: 1rem;\n    }\n\n    .testimonial-meta {\n      font-size: 13px;\n      color: var(--text-dim);\n    }\n\n    .testimonial-meta strong {\n      display: block;\n      font-size: 14px;\n      font-weight: 500;\n      color: var(--text-muted);\n      margin-bottom: 1px;\n    }\n\n    /* BOTTOM CTA */\n    .bottom-cta {\n      max-width: 560px;\n      margin: 0 auto;\n      padding: 4rem 2rem 6rem;\n      text-align: center;\n    }\n\n    .bottom-cta h2 {\n      font-family: var(--serif);\n      font-size: clamp(2rem, 4.5vw, 2.75rem);\n      font-weight: 400;\n      line-height: 1.15;\n      color: var(--text);\n      margin-bottom: 1rem;\n    }\n\n    .bottom-cta h2 em {\n      font-style: italic;\n      color: var(--purple-light);\n    }\n\n    .bottom-cta p {\n      font-size: 18px;\n      color: var(--text-muted);\n      margin-bottom: 2rem;\n    }\n\n    .btn-bottom {\n      display: inline-flex;\n      align-items: center;\n      gap: 0.5rem;\n      padding: 0.85rem 2rem;\n      background: var(--purple);\n      color: #fff;\n      font-size: 15px;\n      font-weight: 500;\n      font-family: var(--sans);\n      border: none;\n      border-radius: 8px;\n      cursor: pointer;\n      text-decoration: none;\n      transition: background 0.2s;\n    }\n\n    .btn-bottom:hover { background: #6a4dab; }\n\n    /* FOOTER */\n    footer {\n      border-top: 0.5px solid rgba(124, 92, 191, 0.1);\n      padding: 1.5rem 2rem;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      flex-wrap: wrap;\n      gap: 1rem;\n      max-width: 800px;\n      margin: 0 auto;\n    }\n\n    .footer-copy {\n      font-size: 12px;\n      color: var(--text-dim);\n    }\n\n    .footer-links {\n      display: flex;\n      gap: 1.25rem;\n    }\n\n    .footer-links a {\n      font-size: 12px;\n      color: var(--text-dim);\n      text-decoration: none;\n      transition: color 0.2s;\n    }\n\n    .footer-links a:hover { color: var(--text-muted); }\n\n    /* AMBIENT GLOW */\n    .glow {\n      position: fixed;\n      top: -200px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 600px;\n      height: 400px;\n      background: radial-gradient(ellipse at center, rgba(124, 92, 191, 0.08) 0%, transparent 70%);\n      pointer-events: none;\n      z-index: 0;\n    }\n\n    main { position: relative; z-index: 1; }\n\n    @media (max-width: 560px) {\n      nav { padding: 1rem 1.25rem; }\n      .hero { padding: 4rem 1.25rem 3rem; }\n      .features, .testimonials, .bottom-cta { padding-left: 1.25rem; padding-right: 1.25rem; }\n      footer { padding: 1.25rem; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      * { transition: none !important; }\n    }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003cdiv class=\"glow\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\n\n\n\u003cmain\u003e\n  \u003c!-- HERO --\u003e\n  \u003csection class=\"hero\" id=\"waitlist\"\u003e\n    \u003cdiv class=\"eyebrow\"\u003ePrivate beta — launching soon\u003c/div\u003e\n\n    \u003ch1\u003eYour thoughts finally have\u003cbr\u003e\u003cem\u003esomewhere to land.\u003c/em\u003e\u003c/h1\u003e\n\n    \u003cp class=\"hero-sub\"\u003eYour voice. Your patterns. Your clarity.\u003c/p\u003e\n\n    \u003cdiv class=\"form-card\"\u003e\n      \u003cdiv id=\"form-area\"\u003e\n        \u003cdiv class=\"form-group\"\u003e\n          \u003cinput type=\"email\" id=\"email\" name=\"email\" placeholder=\"you@example.com\" autocomplete=\"email\" required /\u003e\n        \u003c/div\u003e\n        \u003cbutton class=\"btn-join\" id=\"join-btn\" type=\"button\"\u003e\n          Get early access\n          \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n            \u003cpath d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"white\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n          \u003c/svg\u003e\n        \u003c/button\u003e\n        \u003cp class=\"form-note\"\u003eNo spam. One email when we launch.\u003c/p\u003e\n        \u003cp class=\"gmail-note\"\u003eMust be a Gmail or Google account address to receive your beta invite.\u003c/p\u003e\n        \u003cp class=\"error-msg\" id=\"error-msg\" aria-live=\"polite\"\u003e\u003c/p\u003e\n\n        \u003c!-- TRUST STRIP --\u003e\n        \u003cdiv class=\"trust-strip\" aria-label=\"Product trust signals\"\u003e\n          \u003cdiv class=\"trust-item\"\u003e\n            \u003csvg viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n              \u003crect x=\"2\" y=\"6\" width=\"10\" height=\"7\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n              \u003cpath d=\"M4.5 6V4.5a2.5 2.5 0 015 0V6\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"/\u003e\n            \u003c/svg\u003e\n            Private by design\n          \u003c/div\u003e\n          \u003cdiv class=\"trust-item\"\u003e\n            \u003csvg viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n              \u003ccircle cx=\"7\" cy=\"7\" r=\"5.5\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n              \u003cpath d=\"M7 4v3l2 1.5\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\"/\u003e\n            \u003c/svg\u003e\n            Enterprise-grade transcription accuracy\n          \u003c/div\u003e\n          \u003cdiv class=\"trust-item\"\u003e\n            \u003csvg viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n              \u003cpath d=\"M7 1.5l1.5 3 3.5.5-2.5 2.5.5 3.5L7 9.5 4 11l.5-3.5L2 5l3.5-.5L7 1.5z\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/\u003e\n            \u003c/svg\u003e\n            Built for neurodivergent people\n          \u003c/div\u003e\n          \u003cdiv class=\"trust-item\"\u003e\n            \u003csvg viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n              \u003cpath d=\"M2 7c0-2.76 2.24-5 5-5s5 2.24 5 5-2.24 5-5 5-5-2.24-5-5z\" stroke=\"currentColor\" stroke-width=\"1.2\"/\u003e\n              \u003cpath d=\"M5 7l1.5 1.5L9.5 5\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n            \u003c/svg\u003e\n            30+ languages supported\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"success-msg\" id=\"success-msg\"\u003e\n        \u003cdiv class=\"check\"\u003e\n          \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n            \u003cpath d=\"M4 10l5 5 7-8\" stroke=\"#a78de0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n          \u003c/svg\u003e\n        \u003c/div\u003e\n        \u003cp\u003e\u003cstrong\u003eYou're on the list.\u003c/strong\u003e\u003cbr\u003eWe'll reach out when Vocolens is ready.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n\n\n  \u003c!-- FEATURES --\u003e\n  \u003csection class=\"features\" aria-labelledby=\"features-heading\"\u003e\n    \u003cp class=\"section-label\"\u003eHow it works\u003c/p\u003e\n    \u003ch2 class=\"features-heading\" id=\"features-heading\"\u003eA quieter way to know yourself.\u003c/h2\u003e\n    \u003cp class=\"features-sub\"\u003eWriting is hard. Talking is human. Vocolens turns your voice into a thoughtful practice.\u003c/p\u003e\n\n    \u003cdiv class=\"feature-grid\"\u003e\n      \u003cdiv class=\"feature-card\"\u003e\n        \u003cdiv class=\"feature-icon\"\u003e\n          \u003csvg viewBox=\"0 0 18 18\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n            \u003crect x=\"6\" y=\"2\" width=\"6\" height=\"8\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n            \u003cpath d=\"M3 9c0 3.31 2.69 6 6 6s6-2.69 6-6\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/\u003e\n            \u003cline x1=\"9\" y1=\"15\" x2=\"9\" y2=\"17\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/\u003e\n          \u003c/svg\u003e\n        \u003c/div\u003e\n        \u003ch3\u003eSpeak freely\u003c/h3\u003e\n        \u003cp\u003eOpen Vocolens and just talk. No prompts, no judgment. Whatever's on your mind.\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"feature-card\"\u003e\n        \u003cdiv class=\"feature-icon\"\u003e\n          \u003csvg viewBox=\"0 0 18 18\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n            \u003ccircle cx=\"9\" cy=\"9\" r=\"7\" stroke=\"currentColor\" stroke-width=\"1.4\"/\u003e\n            \u003cpath d=\"M6 9l2 2 4-4\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n          \u003c/svg\u003e\n        \u003c/div\u003e\n        \u003ch3\u003eGentle insight, not judgment\u003c/h3\u003e\n        \u003cp\u003eAI surfaces the emotional layers in what you said — themes, patterns, gentle questions. You decide what's true.\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"feature-card\"\u003e\n        \u003cdiv class=\"feature-icon\"\u003e\n          \u003csvg viewBox=\"0 0 18 18\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n            \u003cpath d=\"M3 14l3-4 3 2 3-5 3 3\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n          \u003c/svg\u003e\n        \u003c/div\u003e\n        \u003ch3\u003eSee the patterns you've been living inside\u003c/h3\u003e\n        \u003cp\u003eOver weeks and months, your emotional fingerprint comes into focus. Growth you can actually feel.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003cdiv class=\"section-divider\"\u003e\u003c/div\u003e\n\n  \u003c!-- TESTIMONIALS --\u003e\n  \u003csection class=\"testimonials\" aria-labelledby=\"testimonials-heading\"\u003e\n    \u003cp class=\"section-label\"\u003eReal stories\u003c/p\u003e\n    \u003ch2 class=\"features-heading\" id=\"testimonials-heading\"\u003ePeople who found their clarity.\u003c/h2\u003e\n\n    \u003cdiv class=\"testimonial-grid\"\u003e\n      \u003cdiv class=\"testimonial-card\"\u003e\n        \u003cdiv class=\"stars\" aria-label=\"5 out of 5 stars\"\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n        \u003c/div\u003e\n        \u003cblockquote\u003e\"Finally a journal that moves as fast as my mind.\"\u003c/blockquote\u003e\n        \u003cdiv class=\"testimonial-meta\"\u003e\n          \u003cstrong\u003eJordan\u003c/strong\u003e\n          ADHD \u0026amp; Creative\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"testimonial-card\"\u003e\n        \u003cdiv class=\"stars\" aria-label=\"5 out of 5 stars\"\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n        \u003c/div\u003e\n        \u003cblockquote\u003e\"Like having a translator for my own mind.\"\u003c/blockquote\u003e\n        \u003cdiv class=\"testimonial-meta\"\u003e\n          \u003cstrong\u003eRiley\u003c/strong\u003e\n          Autistic \u0026amp; Graduate Student\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"testimonial-card\"\u003e\n        \u003cdiv class=\"stars\" aria-label=\"5 out of 5 stars\"\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n          \u003csvg viewBox=\"0 0 12 12\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\u003cpolygon points=\"6,1 7.5,4.5 11,5 8.5,7.5 9,11 6,9.5 3,11 3.5,7.5 1,5 4.5,4.5\"/\u003e\u003c/svg\u003e\n        \u003c/div\u003e\n        \u003cblockquote\u003e\"Finally, a safe space for my unfiltered self.\"\u003c/blockquote\u003e\n        \u003cdiv class=\"testimonial-meta\"\u003e\n          \u003cstrong\u003eCasey\u003c/strong\u003e\n          Tourette's \u0026amp; Remote Worker\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003cdiv class=\"section-divider\"\u003e\u003c/div\u003e\n\n  \u003c!-- BOTTOM CTA --\u003e\n  \u003csection class=\"bottom-cta\" aria-labelledby=\"cta-heading\"\u003e\n    \u003ch2 id=\"cta-heading\"\u003eYour thoughts deserve\u003cbr\u003e\u003cem\u003esomewhere to land.\u003c/em\u003e\u003c/h2\u003e\n    \u003cp\u003eJoin the waitlist — one email when we launch, nothing more.\u003c/p\u003e\n    \u003ca href=\"#waitlist\" class=\"btn-bottom\"\u003e\n      Get early access\n      \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"\u003e\n        \u003cpath d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"white\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n      \u003c/svg\u003e\n    \u003c/a\u003e\n  \u003c/section\u003e\n\u003c/main\u003e\n\n\n\n\u003cscript\u003e\n  const btn = document.getElementById('join-btn');\n  const emailInput = document.getElementById('email');\n  const formArea = document.getElementById('form-area');\n  const successMsg = document.getElementById('success-msg');\n  const errorMsg = document.getElementById('error-msg');\n\n  const commonTypos = {\n    'gamil.com': 'gmail.com',\n    'gmai.com': 'gmail.com',\n    'gmial.com': 'gmail.com',\n    'gmal.com': 'gmail.com',\n    'gmil.com': 'gmail.com',\n    'gmaill.com': 'gmail.com',\n    'gmail.co': 'gmail.com',\n    'gmail.cm': 'gmail.com',\n    'gmail.con': 'gmail.com',\n    'gmail.cpm': 'gmail.com',\n    'googlemail.com': 'gmail.com',\n  };\n\n  const gmailDomains = ['gmail.com', 'googlemail.com'];\n\n  function showError(msg) {\n    errorMsg.textContent = msg;\n    emailInput.style.borderColor = 'rgba(220, 100, 100, 0.6)';\n  }\n\n  function clearError() {\n    errorMsg.textContent = '';\n    emailInput.style.borderColor = '';\n  }\n\n  function validate(email) {\n    if (!email) return { ok: false, msg: 'Please enter your email address.' };\n\n    const basicPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n    if (!basicPattern.test(email)) {\n      if (!email.includes('@')) return { ok: false, msg: 'Missing @ — check your email address.' };\n      if (email.split('@').length \u003e 2) return { ok: false, msg: 'Too many @ symbols — check your email address.' };\n      const parts = email.split('@');\n      if (!parts[1] || !parts[1].includes('.')) return { ok: false, msg: 'Missing domain — e.g. yourname@gmail.com' };\n      return { ok: false, msg: 'That doesn\\'t look like a valid email address.' };\n    }\n\n    const domain = email.split('@')[1].toLowerCase();\n\n    if (commonTypos[domain]) {\n      return { ok: false, msg: `Did you mean ${email.split('@')[0]}@${commonTypos[domain]}?` };\n    }\n\n    if (!gmailDomains.includes(domain)) {\n      return { ok: false, msg: 'Please use a Gmail address — Google needs it to send your beta invite.' };\n    }\n\n    return { ok: true };\n  }\n\n  btn.addEventListener('click', function () {\n    const email = emailInput.value.trim().toLowerCase();\n    const result = validate(email);\n\n    if (!result.ok) {\n      showError(result.msg);\n      emailInput.focus();\n      return;\n    }\n\n    clearError();\n    formArea.style.display = 'none';\n    successMsg.style.display = 'block';\n  });\n\n  emailInput.addEventListener('input', clearError);\n  emailInput.addEventListener('blur', function () {\n    const email = emailInput.value.trim().toLowerCase();\n    if (email) {\n      const result = validate(email);\n      if (!result.ok) showError(result.msg);\n    }\n  });\n\u003c/script\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e\n"])</script><script nonce="2jmLU21GExIbEsMqPZItbQ==">self.__next_f.push([1,"5:[\"$\",\"$L18\",null,{\"artifact\":{\"title\":\"vocolens-waitlist.html\",\"language\":\"$undefined\",\"type\":\"text/html\",\"content\":\"$19\",\"description\":\"Join the Vocolens waitlist for early access to a voice journal app designed for neurodivergent minds. Private, accurate transcription, pattern insights. Gmail required.\",\"content_score\":6,\"seo_title\
